<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Julius Quiz — FIFA 19 Edition</title>
<style>
:root{--pink:#ef168a;--cyan:#35e5d0;--blue:#214fc0;--navy:#172b60;--bg:#dfe5f3}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#192747}
header{color:white;padding:24px;background:linear-gradient(115deg,#132456,#2456bb 48%,#ed168a);position:relative;overflow:hidden}
header:after{content:"";position:absolute;right:-5%;top:20px;width:65%;height:170px;background:linear-gradient(120deg,transparent 8%,#ef168a 9% 24%,transparent 25% 35%,#35e5d0 36% 49%,transparent 50%);transform:skewY(-12deg);opacity:.85}
header>*{position:relative;z-index:1}.top{display:flex;justify-content:space-between;font-size:12px;letter-spacing:2px;font-weight:900}h1{font-size:clamp(35px,8vw,60px);font-style:italic;line-height:.95;margin:30px 0 10px}header p{font-size:13px}
nav{display:flex;gap:4px;padding:8px;background:#f7f8fc;flex-wrap:wrap}nav button{flex:1;min-width:70px;padding:13px 8px;border:0;background:transparent;color:#34466e;font-weight:900;font-size:11px}nav button.active{background:var(--blue);color:white;border-bottom:3px solid var(--cyan)}
main{padding:18px;max-width:900px;margin:auto;min-height:400px}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:900;color:#566a97}h2{font-size:27px;font-style:italic;text-transform:uppercase;color:var(--navy);margin:6px 0 12px}.muted{color:#687696;font-size:12px;line-height:1.5}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}.tile{min-height:125px;text-align:left;border:0;padding:16px;background:white;color:#20356b;box-shadow:0 3px #d4dcec;cursor:pointer;position:relative;overflow:hidden}.tile strong{display:block;font-size:19px;font-style:italic;text-transform:uppercase}.tile span{display:block;font-size:12px;line-height:1.45;margin-top:9px}.tile:after{content:"19";position:absolute;right:5px;bottom:-18px;font-size:76px;font-weight:1000;opacity:.1}.primary{background:var(--blue);color:white}.pink{background:var(--pink);color:white}.cyan{background:var(--cyan);color:#15264e}
.panel{background:white;padding:16px;margin:12px 0;box-shadow:0 3px #d5ddeb}.btn{border:0;background:var(--blue);color:white;font-size:12px;font-weight:900;padding:13px 16px;cursor:pointer;text-transform:uppercase}.btn.secondary{background:#e6ebf6;color:#243866}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.progress{height:7px;background:#dfe5f2;margin:12px 0}.progress span{height:100%;display:block;background:linear-gradient(90deg,var(--pink),var(--cyan))}
.question{font-size:clamp(24px,5vw,36px);font-weight:1000;font-style:italic;text-transform:uppercase;color:var(--navy);margin:18px 0}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.answer{border:1px solid #d9e0ef;background:#f8f9fc;text-align:left;padding:14px;color:#23355e;cursor:pointer;font-size:13px;line-height:1.45}.answer.correct{background:#d9f7e9;border-color:#169c69}.answer.wrong{background:#ffe1ed;border-color:#e24b85}.feedback{padding:13px;background:#e9eef9;border-left:4px solid var(--blue);font-size:13px;line-height:1.5;margin:14px 0}.good{background:#e0f8ed;border-color:#149b68}.bad{background:#fff0f6;border-color:#e72a85}
.listrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #e4e9f3}.rank{width:30px;height:30px;display:grid;place-items:center;background:#e9eef8;font-weight:900}.person{flex:1;font-size:13px;font-weight:800}.small{display:block;color:#75819c;font-size:10px;font-weight:400;margin-top:3px}.points{font-size:13px;font-weight:900;color:var(--blue)}label{display:block;font-size:12px;font-weight:900;margin:12px 0 6px}input[type=color]{width:100%;height:45px}.swatches{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.swatch{width:32px;height:32px;border:2px solid white;outline:1px solid #bbb;border-radius:50%;cursor:pointer}footer{background:#142554;color:#cbd7f4;padding:15px;font-size:10px;letter-spacing:1px;display:flex;justify-content:space-between}
@media(max-width:500px){.answers{grid-template-columns:1fr}.tiles{grid-template-columns:1fr}header{padding:20px}main{padding:14px}}
</style></head>
<body>
<header><div class="top"><span>JULIUS WORLD / QUIZ</span><span>FIFA 19 ERA</span></div><h1 id="hero">JULIUS<br>QUIZ CLUB</h1><p>GAMLA FIFA-VIBBAR. STORA FRÅGOR. DITT SPEL.</p></header>
<nav><button class="active" data-page="home">HEM</button><button data-page="play">SPELA</button><button data-page="results">RESULTAT</button><button data-page="settings">SETTINGS</button></nav>
<main id="main"></main><footer><span>JULIUS QUIZ SIDA</span><span>FIFA 19-INSPIRED DESIGN</span></footer>
<script>
const Q=[
["Mord","Att med flit döda någon efter att ha planerat det.",["Att döda någon efter planering och med avsikt","Att råka orsaka någons död","Att sprida rykten","Att ta något utan att betala"],0],
["Dråp","Att uppsåtligen döda någon utan att det bedöms som mord.",["Att köra berusad","Att döda någon i en situation som inte bedöms som mord","Att hota ett vittne","Att ljuga under ed"],1],
["Vållande till annans död","Att av oaktsamhet orsaka en annan persons död.",["Att planera att döda någon","Att köpa stöldgods","Att av oaktsamhet orsaka någons död","Att störa ordningen"],2],
["Misshandel","Att med avsikt orsaka en annan person kroppsskada eller smärta.",["Att med flit orsaka skada eller smärta","Att kopiera en bild","Att köpa något stulet","Att köra berusad"],0],
["Ofredande","Att störa eller kränka någon på ett hänsynslöst sätt.",["Att ljuga under ed","Att störa eller kränka någon hänsynslöst","Att ta någon annans sak","Att hota ett vittne"],1],
["Våldtäkt","Sexuella handlingar genomförs utan frivilligt deltagande.",["Att säga något elakt","Att köra mot rött","Sexuella handlingar utan frivilligt deltagande","Att köpa något stulet"],2],
["Sexuellt ofredande","Att utsätta någon för ett kränkande, oönskat sexuellt beteende.",["Att utsätta någon för oönskat sexuellt beteende","Att ta något från en butik","Att sprida ett rykte","Att köra berusad"],0],
["Våld mot tjänsteman","Våld eller hot mot en tjänsteman i samband med myndighetsutövning.",["Att skrika på en kompis","Våld eller hot mot en tjänsteman i tjänsten","Att ljuga i en rättegång","Att kopiera en text"],1],
["Rattfylleri","Att köra ett motordrivet fordon påverkad av alkohol eller andra berusande ämnen.",["Att köra för fort","Att köpa en bil","Att köra ett fordon berusad","Att cykla på trottoaren"],2],
["Mened","Att medvetet lämna en osann uppgift under ed.",["Att medvetet ljuga under ed i domstol","Att hota en polis","Att stjäla en cykel","Att störa grannar"],0],
["Stöld","Att olovligen ta något som tillhör någon annan.",["Att köpa något stulet","Att olovligen ta något som tillhör någon annan","Att sprida ett rykte","Att köra berusad"],1],
["Häleri","Att köpa eller hantera egendom som man vet kommer från brott.",["Att ta en bild","Att hota ett vittne","Att köpa eller hantera något som kommer från brott","Att ljuga under ed"],2],
["Förtal","Att lämna uppgifter om en person som kan utsätta personen för andras missaktning.",["Att sprida uppgifter som skadar någons rykte","Att ta en sak från en butik","Att slå någon","Att köra berusad"],0],
["Brott mot upphovsrättslagen","Att använda ett skyddat verk utan tillstånd när tillstånd krävs.",["Att störa grannar","Att använda skyddat material utan nödvändigt tillstånd","Att ljuga under ed","Att köpa stöldgods"],1],
["Förargelseväckande beteende","Ett beteende på offentlig plats som stör allmänheten och omfattas av lagen.",["Att planera ett brott","Att hota ett vittne","Att bete sig störande på ett sätt som omfattas av lagen","Att ta en bild"],2],
["Övergrepp i rättssak","Att exempelvis hota någon för att påverka personens medverkan i en rättslig process.",["Att hota ett vittne för att påverka en rättslig process","Att köpa stöldgods","Att köra berusad","Att kopiera en bild"],0],
["Bedrägeri","Att vilseleda någon för att få en orättmätig vinning.",["Att ljuga under ed","Att lura någon för att få en orättmätig vinning","Att störa någon","Att råka orsaka en olycka"],1]];
const demo=["PixelKungen","BlåVitt99","NeymarFan10","FUT_Mästaren","RonaldoCR7","GamerGurra","QuizLegend","SvenskaStjärnan","TurboTobbe","FIFA_Fredde","Nattugglan","SkillMoves","Bollkontroll","Vinnarskallen","MiniManager","TikiTakaTom"].map((name,i)=>({name,score:Math.max(6,17-i)+(i*3)%5})).sort((a,b)=>b.score-a.score);
let history=JSON.parse(localStorage.getItem('jqhist')||'[]'),prefs=JSON.parse(localStorage.getItem('jqprefs')||'{"bg":"#dfe5f3","pink":"#ef168a"}'),page='home',order=[],idx=0,score=0,chosen=-1,answered=false,started=0;
const main=document.querySelector('#main');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('jqhist',JSON.stringify(history));localStorage.setItem('jqprefs',JSON.stringify(prefs))}
function go(p){page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
function home(){return `<div class="eyebrow">Välkommen till din egen quizvärld</div><h2>Välj ditt nästa läge</h2><p class="muted">En egen quizmeny med FIFA 19-känsla, färgstarka penseldrag och dina resultat på ett ställe.</p><div class="tiles"><button class="tile primary" data-go="play"><strong>Starta quiz</strong><span>17 brottsbegrepp. Hur många kan du?</span></button><button class="tile pink" data-go="leader"><strong>Leaderboard</strong><span>Se poängen för alla fejkspelare.</span></button><button class="tile cyan" data-go="results"><strong>Mina resultat</strong><span>Historik, poäng och framsteg.</span></button><button class="tile" data-go="settings"><strong>Settings</strong><span>Customize bakgrundsfärgen.</span></button></div><div class="panel"><div class="row"><h2 style="font-size:21px">Quizkarriär</h2><strong>${history.length} genomförda quiz</strong></div><p class="muted">${history.length?'Senaste resultat: '+history[0].score+'/'+history[0].total+' rätt.':'Dina resultat visas här efter ditt första quiz.'}</p><button class="btn" data-action="start">KÖR IGÅNG</button></div>`}
function start(){order=Q.map((_,i)=>i).sort(()=>Math.random()-.5);idx=0;score=0;chosen=-1;answered=false;started=Date.now();go('quiz')}
function quiz(){if(idx>=order.length)return finish();let q=Q[order[idx]];return `<div class="row"><div><div class="eyebrow">Brottsquiz / Träning</div><h2>Fråga ${idx+1} av ${order.length}</h2></div><strong>${score} P</strong></div><div class="progress"><span style="width:${idx/order.length*100}%"></span></div><div class="question">Vad betyder<br>${esc(q[0])}?</div><p class="muted">Välj det svar som bäst förklarar begreppet.</p><div class="answers">${q[2].map((a,i)=>`<button class="answer ${answered&&i===q[4]?'correct':''} ${answered&&i===chosen&&i!==q[4]?'wrong':''}" data-answer="${i}" ${answered?'disabled':''}><b>${String.fromCharCode(65+i)}.</b> ${esc(a)}</button>`).join('')}</div>${answered?`<div class="feedback ${chosen===q[4]?'good':'bad'}"><strong>${chosen===q[4]?'RÄTT SVAR!':'INTE RIKTIGT – HÄR ÄR VARFÖR'}</strong><br>${esc(q[1])}</div><div class="panel"><b>${idx%2?'Neymar Jr':'Cristiano Ronaldo'} säger:</b><p>${chosen===q[4]?'Snyggt! Du har koll på det här begreppet.':'Rätt svar är: '+esc(q[2][q[4]])+'. '+esc(q[1])}</p></div><button class="btn" data-action="next">${idx===order.length-1?'SE RESULTAT':'NÄSTA FRÅGA'} →</button>`:''}`}
function finish(){history.unshift({score,total:order.length,date:new Date().toLocaleString('sv-SE'),seconds:Math.round((Date.now()-started)/1000)});history=history.slice(0,100);save();go('complete')}
function results(){return `<div class="eyebrow">Din statistik</div><h2>Resultathistorik</h2><div class="tiles"><div class="tile"><strong>${history.length}</strong><span>Genomförda quiz</span></div><div class="tile cyan"><strong>${history.length?Math.round(history.reduce((n,h)=>n+h.score/h.total*100,0)/history.length):0}%</strong><span>Genomsnitt rätt</span></div></div><div class="panel"><div class="row"><h2 style="font-size:20px">Tidigare quiz</h2><button class="btn secondary" data-action="clear">Rensa historik</button></div>${history.length?history.map((h,i)=>`<div class="listrow"><div class="rank">${i+1}</div><div class="person">Quiz genomfört<span class="small">${esc(h.date)} · ${h.seconds}s</span></div><div class="points">${h.score}/${h.total}</div></div>`).join(''):'<p class="muted">Ingen historik ännu. Spela ett quiz så visas resultatet här.</p>'}</div>`}
function leaderboard(){let all=demo.slice();if(history.length)all.push({name:'JULIUS',score:Math.max(...history.map(h=>Math.round(h.score/ h.total*17)))});all.sort((a,b)=>b.score-a.score);return `<div class="eyebrow">Påhittad topplista</div><h2>Leaderboard</h2><p class="muted">Exempelspelare med fejkade poäng – de är inte riktiga användare.</p><div class="panel">${all.map((x,i)=>`<div class="listrow"><div class="rank">${i+1}</div><div class="person">${esc(x.name)}<span class="small">${x.name==='JULIUS'?'Ditt bästa resultat':'Exempelspelare'}</span></div><div class="points">${x.score}/17</div></div>`).join('')}</div><button class="btn" data-go="play">SPELA NU</button>`}
function settings(){return `<div class="eyebrow">Personlig anpassning</div><h2>Settings</h2><div class="panel"><h2 style="font-size:20px">Customize</h2><p class="muted">Välj sidans bakgrundsfärg och accentfärg.</p><label>Bakgrundsfärg</label><input type="color" id="bg" value="${prefs.bg}"><div class="swatches">${['#dfe5f3','#dcecff','#f9dff0','#d7f6f0','#e7e0ff','#202b49','#f4ead5'].map(c=>`<button class="swatch" data-color="${c}" style="background:${c}"></button>`).join('')}</div><label>Accentfärg</label><input type="color" id="pink" value="${prefs.pink}"><div class="row"><button class="btn" data-action="apply">SPARA DESIGN</button><button class="btn secondary" data-action="reset">ÅTERSTÄLL</button></div></div>`}
function complete(){let h=history[0];return `<div class="eyebrow">Matchen är slut</div><h2>Quiz klart!</h2><div class="panel" style="text-align:center;background:linear-gradient(135deg,#172c65,#2354c3);color:white"><div style="color:#35e5d0;font-weight:bold">DITT RESULTAT</div><div style="font-size:58px;font-weight:1000;font-style:italic">${h.score}<span style="font-size:22px">/${h.total}</span></div><div class="progress"><span style="width:${h.score/h.total*100}%"></span></div><p>${Math.round(h.score/h.total*100)}% rätt · ${h.seconds} sekunder</p><p>${h.score===h.total?'Perfekt! Du satte alla begrepp.':h.score>=12?'Starkt jobbat! Du kan många av begreppen.':'Bra träning. Läs förklaringarna och försök igen!'}</p></div><div class="tiles"><button class="tile primary" data-action="start"><strong>Spela igen</strong><span>Nya frågor i ny ordning.</span></button><button class="tile cyan" data-go="results"><strong>Resultat</strong><span>Se din historik.</span></button></div>`}
function render(){document.body.style.background=prefs.bg;document.documentElement.style.setProperty('--pink',prefs.pink);main.innerHTML=page==='home'?home():page==='play'?`<div class="eyebrow">Välj spelläge</div><h2>Spela</h2><div class="tiles"><button class="tile primary" data-action="start"><strong>Starta quiz</strong><span>Alla 17 brottsbegrepp i slumpad ordning.</span></button><button class="tile pink" data-go="leader"><strong>Leaderboard</strong><span>Se alla fejkspelare och poäng.</span></button></div><div class="panel"><p class="muted">Läs frågan noga. Du får en förklaring efter varje svar.</p><button class="btn" data-action="start">STARTA TRÄNING</button></div>`:page==='quiz'?quiz():page==='results'?results():page==='leader'?leaderboard():page==='settings'?settings():complete()}
main.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.color){prefs.bg=b.dataset.color;document.querySelector('#bg').value=prefs.bg;save();render();return}if(b.dataset.answer!==undefined&&!answered){chosen=+b.dataset.answer;answered=true;if(chosen===Q[order[idx]][4])score++;render();return}switch(b.dataset.action){case'start':start();break;case'next':idx++;answered=false;chosen=-1;render();break;case'apply':prefs.bg=document.querySelector('#bg').value;prefs.pink=document.querySelector('#pink').value;save();render();break;case'reset':prefs={bg:'#dfe5f3',pink:'#ef168a'};save();render();break;case'clear':if(confirm('Rensa quizhistoriken?')){history=[];save();render()}break}});
render();
</script></body></html>
